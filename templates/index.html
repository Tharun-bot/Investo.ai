<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investo.ai - AI-Powered Stock Analysis</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover:hover {
            transform: translateY(-2px);
            transition: transform 0.2s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [stockData, setStockData] = useState(null);
            const [searchSymbol, setSearchSymbol] = useState('AAPL');
            const [loading, setLoading] = useState(false);
            const [signals, setSignals] = useState([]);
            const [marketData, setMarketData] = useState([]);

            const fetchStockData = async (symbol) => {
                if (!symbol || symbol === 'undefined' || symbol.trim() === '') {
                    console.error('Invalid symbol provided');
                    return;
                }
                
                setLoading(true);
                try {
                    const response = await fetch(`/api/stocks/${symbol.toUpperCase()}/`);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    if (data.error) {
                        alert(`Error: ${data.error}`);
                        return;
                    }
                    setStockData(data);
                } catch (error) {
                    console.error('Error fetching stock data:', error);
                    alert(`Failed to fetch data for ${symbol}. Please check the symbol and try again.`);
                } finally {
                    setLoading(false);
                }
            };

            const generateSignal = async (symbol) => {
                if (!symbol || symbol === 'undefined' || symbol.trim() === '') {
                    console.error('Invalid symbol provided for signal generation');
                    return;
                }
                
                setLoading(true);
                try {
                    const response = await fetch(`/api/stocks/${symbol.toUpperCase()}/signal/`, {
                        method: 'POST'
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    if (data.error) {
                        alert(`Error generating signal: ${data.error}`);
                        return;
                    }
                    // Refresh stock data to get updated signal
                    await fetchStockData(symbol);
                } catch (error) {
                    console.error('Error generating signal:', error);
                    alert(`Failed to generate signal for ${symbol}. Please try again.`);
                } finally {
                    setLoading(false);
                }
            };

            const fetchRecentSignals = async () => {
                try {
                    const response = await fetch('/api/stocks/signals/recent/');
                    const data = await response.json();
                    setSignals(data);
                } catch (error) {
                    console.error('Error fetching signals:', error);
                }
            };

            const fetchMarketData = async () => {
                try {
                    const response = await fetch('/api/stocks/market/overview/');
                    const data = await response.json();
                    setMarketData(data);
                } catch (error) {
                    console.error('Error fetching market data:', error);
                }
            };

            useEffect(() => {
                fetchStockData('AAPL');
                fetchRecentSignals();
                fetchMarketData();
            }, []);

            const handleSearch = (e) => {
                e.preventDefault();
                const trimmedSymbol = searchSymbol.trim().toUpperCase();
                if (trimmedSymbol && trimmedSymbol !== 'UNDEFINED') {
                    fetchStockData(trimmedSymbol);
                } else {
                    alert('Please enter a valid stock symbol');
                }
            };

            const getSignalColor = (signal) => {
                switch (signal) {
                    case 'BUY': return 'text-green-600 bg-green-100';
                    case 'SELL': return 'text-red-600 bg-red-100';
                    default: return 'text-yellow-600 bg-yellow-100';
                }
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="gradient-bg text-white shadow-lg">
                        <div className="max-w-7xl mx-auto px-4 py-6">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center space-x-3">
                                    <div className="text-3xl font-bold">🧠</div>
                                    <h1 className="text-3xl font-bold">Investo.ai</h1>
                                    <span className="bg-white bg-opacity-20 px-3 py-1 rounded-full text-sm">
                                        AI-Powered
                                    </span>
                                </div>
                                
                                <form onSubmit={handleSearch} className="flex space-x-2">
                                    <input
                                        type="text"
                                        value={searchSymbol}
                                        onChange={(e) => setSearchSymbol(e.target.value)}
                                        placeholder="Enter stock symbol (e.g., AAPL)"
                                        className="px-4 py-2 rounded-lg text-gray-800 w-64"
                                    />
                                    <button
                                        type="submit"
                                        className="bg-white bg-opacity-20 hover:bg-opacity-30 px-6 py-2 rounded-lg transition-colors"
                                    >
                                        Search
                                    </button>
                                </form>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 py-8">
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* Main Content */}
                            <div className="lg:col-span-2 space-y-6">
                                {/* Stock Overview */}
                                {stockData && (
                                    <div className="bg-white rounded-xl shadow-lg p-6 card-hover">
                                        <div className="flex justify-between items-start mb-6">
                                            <div>
                                                <h2 className="text-3xl font-bold text-gray-800">
                                                    {stockData.symbol}
                                                </h2>
                                                <p className="text-gray-600">{stockData.name}</p>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-4xl font-bold text-gray-800">
                                                    ${stockData.price}
                                                </div>
                                                <div className={`flex items-center ${stockData.change >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                    <span className="text-lg">
                                                        {stockData.change >= 0 ? '↗' : '↘'} 
                                                        ${Math.abs(stockData.change)} ({Math.abs(stockData.change_percent).toFixed(2)}%)
                                                    </span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Key Metrics */}
                                        <div className="grid grid-cols-4 gap-4 mb-6">
                                            <div className="text-center p-3 bg-gray-50 rounded-lg">
                                                <div className="text-sm text-gray-600">Volume</div>
                                                <div className="font-semibold">{stockData.volume?.toLocaleString()}</div>
                                            </div>
                                            <div className="text-center p-3 bg-gray-50 rounded-lg">
                                                <div className="text-sm text-gray-600">P/E Ratio</div>
                                                <div className="font-semibold">{stockData.pe_ratio?.toFixed(2) || 'N/A'}</div>
                                            </div>
                                            <div className="text-center p-3 bg-gray-50 rounded-lg">
                                                <div className="text-sm text-gray-600">52W High</div>
                                                <div className="font-semibold">${stockData.fifty_two_week_high?.toFixed(2) || 'N/A'}</div>
                                            </div>
                                            <div className="text-center p-3 bg-gray-50 rounded-lg">
                                                <div className="text-sm text-gray-600">52W Low</div>
                                                <div className="font-semibold">${stockData.fifty_two_week_low?.toFixed(2) || 'N/A'}</div>
                                            </div>
                                        </div>

                                        {/* AI Signal */}
                                        {stockData.signal ? (
                                            <div className="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg p-4 border border-blue-200">
                                                <div className="flex justify-between items-center mb-2">
                                                    <div className="flex items-center space-x-2">
                                                        <span className="text-2xl">🎯</span>
                                                        <span className="font-semibold text-blue-900">AI Signal</span>
                                                    </div>
                                                    <span className={`px-3 py-1 rounded-full font-semibold ${getSignalColor(stockData.signal.signal_type)}`}>
                                                        {stockData.signal.signal_type}
                                                    </span>
                                                </div>
                                                <div className="text-sm text-gray-700 mb-2">
                                                    <strong>Confidence:</strong> {stockData.signal.confidence}% | 
                                                    <strong> Target:</strong> ${stockData.signal.target_price}
                                                </div>
                                                <p className="text-sm text-gray-600">{stockData.signal.reason}</p>
                                            </div>
                                        ) : (
                                            <button
                                                onClick={() => generateSignal(stockData.symbol)}
                                                disabled={loading}
                                                className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-semibold py-3 px-6 rounded-lg transition-colors"
                                            >
                                                {loading ? 'Generating...' : 'Generate AI Signal'}
                                            </button>
                                        )}
                                    </div>
                                )}

                                {/* Chart Placeholder */}
                                {stockData && stockData.chart_data && (
                                    <div className="bg-white rounded-xl shadow-lg p-6 card-hover">
                                        <h3 className="text-xl font-semibold mb-4">Price Chart</h3>
                                        <div className="h-64 flex items-center justify-center bg-gray-50 rounded-lg">
                                            <p className="text-gray-500">Chart visualization would go here</p>
                                            <p className="text-sm text-gray-400 ml-2">
                                                ({stockData.chart_data.length} data points available)
                                            </p>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Sidebar */}
                            <div className="space-y-6">
                                {/* Market Overview */}
                                <div className="bg-white rounded-xl shadow-lg p-6 card-hover">
                                    <h3 className="text-xl font-semibold mb-4 flex items-center">
                                        <span className="text-2xl mr-2">📊</span>
                                        Market Overview
                                    </h3>
                                    <div className="space-y-3">
                                        {marketData.map((item, index) => (
                                            <div key={index} className="flex justify-between items-center">
                                                <div>
                                                    <div className="font-medium">{item.name}</div>
                                                    <div className="text-sm text-gray-600">{item.value}</div>
                                                </div>
                                                <div className={`text-sm ${item.positive ? 'text-green-600' : 'text-red-600'}`}>
                                                    {item.positive ? '↗' : '↘'} {Math.abs(item.change_percent).toFixed(2)}%
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Recent Signals */}
                                <div className="bg-white rounded-xl shadow-lg p-6 card-hover">
                                    <h3 className="text-xl font-semibold mb-4 flex items-center">
                                        <span className="text-2xl mr-2">⚡</span>
                                        Recent Signals
                                    </h3>
                                    <div className="space-y-3">
                                        {signals.slice(0, 5).map((signal, index) => (
                                            <div key={index} className="border rounded-lg p-3 hover:bg-gray-50">
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="font-semibold">{signal.stock_symbol}</span>
                                                    <span className={`px-2 py-1 rounded text-xs font-semibold ${getSignalColor(signal.signal_type)}`}>
                                                        {signal.signal_type}
                                                    </span>
                                                </div>
                                                <div className="text-sm text-gray-600">
                                                    Confidence: {signal.confidence}% | ${signal.price_at_signal}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* AI Performance */}
                                <div className="bg-white rounded-xl shadow-lg p-6 card-hover">
                                    <h3 className="text-xl font-semibold mb-4 flex items-center">
                                        <span className="text-2xl mr-2">🤖</span>
                                        AI Performance
                                    </h3>
                                    <div className="space-y-3">
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">Overall Accuracy</span>
                                            <span className="font-semibold">75%</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">Successful Signals</span>
                                            <span className="font-semibold text-green-600">935/1247</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">Avg Return</span>
                                            <span className="font-semibold text-green-600">+8.3%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {loading && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-lg p-6 flex items-center space-x-3">
                                <div className="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
                                <span>Loading...</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
